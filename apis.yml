aid: semble
url: https://raw.githubusercontent.com/api-evangelist/semble/refs/heads/main/apis.yml
name: Semble
kind: company
description: >-
  Semble is a London-headquartered (7 Bell Yard, London, WC2A 2JR) cloud clinical
  and practice-management platform for United Kingdom private and independent
  healthcare providers, from solo clinicians to corporate and enterprise clinics.
  Its modular EHR unifies patient records, appointment scheduling and online
  booking, video consultations, e-prescribing, pathology/lab ordering, clinical
  documentation, invoicing and payments (Semble Pay) and patient communications.
  Semble exposes a single open, secure public GraphQL API at
  https://open.semble.io/graphql, available to Semble clinics at no extra cost,
  letting developers read and write patients, bookings, availability,
  consultations, clinical pathways, prescriptions, labs, invoices, tasks, forms,
  questionnaires and webhooks. Authentication is API-key / token based (an
  x-token header carrying a role-scoped token that expires after 12 hours) rather
  than SMART-on-FHIR; the API is GraphQL-native and does not publish an HL7 FHIR
  CapabilityStatement or a downloadable OpenAPI. Semble emphasises GDPR
  compliance and UK healthcare security standards, with data encrypted in transit
  and at rest.
